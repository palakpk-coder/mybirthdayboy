<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Srujan's Access Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gotham-dark: #2a2a2e;
      --gotham-muted: #4a4a52;
      --champagne: #f7e7ce;
      --rose-gold: #e5b3a3;
      --soft-pink: #ffd1dc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Lato', sans-serif; overflow-x: hidden; background: var(--gotham-dark); transition: background 1s ease; }

    /* --- VIEW CONTROL --- */
    .view { display: none; min-height: 100vh; width: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .active { display: flex; }

    /* --- SCREEN 1: ACCESS DENIED (SAD BATMAN) --- */
    #denied-view { background: #1a1a1d; color: #888; text-align: center; }
    
    .batman-container { width: 150px; height: 150px; position: relative; margin-bottom: 2rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    .batman-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
    .bat-eyes { fill: white; animation: blink 4s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0); } }

    .timer-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; letter-spacing: 2px; margin-top: 1rem; color: #555; }
    #countdown { font-size: 2.5rem; font-weight: 700; color: #a3a3a3; margin-top: 0.5rem; }

    /* --- SCREEN 2: HAPPY BIRTHDAY (HERO) --- */
    #hero-view { background: var(--white); text-align: center; }
    h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; background: linear-gradient(135deg, #e8587a, #9b5fcf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
    .cake-wrap { cursor: pointer; margin: 2rem 0; }
    .flame.out { display: none; }

    /* --- SCREEN 3: GIFT SELECTION --- */
    #gift-view { background: #fff8f2; }
    .gift-container { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
    .gift-box { background: white; border: 1px solid var(--rose-gold); padding: 2rem; border-radius: 15px; width: 150px; text-align: center; cursor: pointer; transition: 0.3s; }
    .gift-box:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    
    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 100; align-items: center; justify-content: center; }
    .modal { background: white; padding: 2.5rem; border-radius: 20px; max-width: 400px; width: 90%; position: relative; text-align: left; line-height: 1.6; }
    .coupon-card { background: linear-gradient(135deg, #ffd700, #daa520); color: white; padding: 1.5rem; border-radius: 10px; text-align: center; font-weight: bold; border: 2px dashed white; }

    /* --- SCREEN 4: POLAROID GALLERY --- */
    #gallery-view { background: linear-gradient(to bottom, #fff5f5, #e5b3a3); padding-top: 4rem; justify-content: flex-start; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 3rem; max-width: 1000px; width: 100%; padding: 2rem; }
    
    .polaroid { background: white; padding: 1rem 1rem 3rem 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transform: rotate(var(--r)); transition: 0.3s; width: 260px; margin: auto; }
    .polaroid:hover { transform: rotate(0deg) scale(1.05); z-index: 10; }
    .polaroid img { width: 100%; height: 280px; object-fit: cover; border: 1px solid #eee; }
    .polaroid p { font-family: 'Dancing Script', cursive; font-size: 1.5rem; text-align: center; margin-top: 1rem; color: #444; }

    .footer-msg { font-family: 'Dancing Script', cursive; font-size: 3rem; margin: 4rem 0; color: #5a3a6e; }

    .nav-btn { margin-top: 2rem; padding: 1rem 2rem; border-radius: 50px; border: none; background: #e8587a; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- VIEW 1: ACCESS DENIED -->
  <section id="denied-view" class="view active">
    <div class="batman-container">
        <svg class="batman-svg" viewBox="0 0 100 100">
            <path d="M20,30 L30,10 L40,25 L60,25 L70,10 L80,30 L80,70 Q80,90 50,90 Q20,90 20,70 Z" fill="#222"/>
            <path class="bat-eyes" d="M35,45 Q40,40 45,45 M55,45 Q60,40 65,45" stroke="white" stroke-width="3" fill="none"/>
            <path d="M45,65 Q50,60 55,65" stroke="#444" stroke-width="2" fill="none"/> <!-- sad mouth -->
        </svg>
    </div>
    <h2 style="font-family:'Playfair Display', serif; color:#eee;">Srujan's Access Denied</h2>
    <div class="timer-text">RE-ENTRY IN:</div>
    <div id="countdown">00:00:00:00</div>
  </section>

  <!-- VIEW 2: HAPPY BIRTHDAY -->
  <section id="hero-view" class="view">
    <div class="eyebrow" style="letter-spacing: 4px; color: var(--rose-gold);">✦ ACCESS FULLY GRANTED ✦</div>
    <h1>Happy Birthday, Srujan!🎉</h1>
    <div class="cake-wrap" id="cakeWrap">
        <svg width="150" height="150" viewBox="0 0 100 100">
            <rect x="20" y="60" width="60" height="30" rx="5" fill="#f9a8d4"/>
            <rect x="30" y="45" width="40" height="15" rx="3" fill="#c4b5fd"/>
            <circle class="flame" cx="50" cy="35" r="5" fill="#fb923c"/>
            <rect x="48" y="40" width="4" height="10" fill="#fde68a"/>
        </svg>
        <p style="font-size: 0.9rem; color: #888;">Tap to blow the candle</p>
    </div>
    <button class="nav-btn" onclick="showView('gift-view')">See Your Gifts →</button>
  </section>

  <!-- VIEW 3: GIFTS -->
  <section id="gift-view" class="view">
    <h2 style="font-family:'Playfair Display'; margin-bottom: 2rem;">Choose a Box, Cutu...</h2>
    <div class="gift-container">
        <div class="gift-box" onclick="openGift(1)">🎁<br>Box 1</div>
        <div class="gift-box" onclick="openGift(2)">🎁<br>Box 2</div>
        <div class="gift-box" onclick="openGift(3)">🎁<br>Box 3</div>
    </div>
    <button class="nav-btn" style="background:#9b5fcf; margin-top: 4rem;" onclick="showView('gallery-view')">One Last Thing... →</button>
  </section>

  <!-- VIEW 4: GALLERY -->
  <section id="gallery-view" class="view">
    <div class="gallery-grid">
        <div class="polaroid" style="--r: -3deg;">
            <img src="p1.jpg" alt="Portrait 1">
            <p>Yours truly</p>
        </div>
        <div class="polaroid" style="--r: 2deg;">
            <img src="p2.jpg" alt="Portrait 2">
            <p>my pretty boy</p>
        </div>
        <div class="polaroid" style="--r: -2deg;">
            <img src="p3.jpg" alt="Portrait 3">
            <p>stars are aligned</p>
        </div>
        <div class="polaroid" style="--r: 4deg;">
            <img src="p4.jpg" alt="Portrait 4">
            <p>always</p>
        </div>
    </div>
    <div class="footer-msg">Meet me soon cutu</div>
  </section>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" id="modalContent" onclick="event.stopPropagation()">
        <!-- Dynamic Content -->
    </div>
  </div>

  <script>
    // --- TIMER LOGIC ---
    const targetDate = new Date("May 01, 2026 00:00:00").getTime();

    function updateTimer() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
            showView('hero-view');
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML = 
            `${days}d ${hours}h ${mins}m ${secs}s`;
    }
    setInterval(updateTimer, 1000);

    // --- NAVIGATION ---
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        window.scrollTo(0,0);
    }

    // --- CAKE ---
    document.getElementById('cakeWrap').onclick = function() {
        document.querySelector('.flame').classList.add('out');
        this.innerHTML += "<p style='color:green; font-weight:bold;'>Wish Made! ✨</p>";
    };

    // --- GIFTS ---
    function openGift(num) {
        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        overlay.style.display = 'flex';

        if(num === 1) {
            content.innerHTML = `<h3>Dear Srujan,</h3><p>My cute big baby I love You. Thank you for always being there. You are my happy place. 🌟</p>`;
        } else if(num === 2) {
            content.innerHTML = `
                <h3>Sruju's Birthday Coupon</h3><br>
                <div class="coupon-card">
                    ADMIT ONE: GIANT HUG 🤗<br>
                    <small>Redeemable upon meeting!</small>
                </div>
                <p style="margin-top:1rem; font-size:0.8rem; text-align:center;">Valid forever. No arguments allowed during redemption.</p>`;
        } else if(num === 3) {
            content.innerHTML = `<h3>Surprise! 🎁</h3><p>Wait... you have <b>Palak</b> now. What else were you even expecting? That's the jackpot! 😂❤️</p>`;
        }
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
  </script>
</body>
</html>
